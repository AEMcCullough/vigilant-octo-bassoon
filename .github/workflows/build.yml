name: Build iOS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install XcodeGen
      run: brew install xcodegen
      
    - name: Generate Xcode Project
      run: |
        xcodegen --version
        xcodegen generate --spec project.yml
      
    - name: Build App
      run: |
        xcodebuild -project Vibe.xcodeproj \
                   -scheme Vibe \
                   -sdk iphonesimulator \
                   -destination 'generic/platform=iOS Simulator' \
                   -configuration Debug \
                   CODE_SIGNING_ALLOWED=NO \
                   build \
                   CONFIGURATION_BUILD_DIR=$PWD/build
                   
    - name: Package to IPA
      run: |
        mkdir Payload
        cp -r build/Vibe.app Payload/
        zip -r Vibe.ipa Payload
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Vibe-App
        path: Vibe.ipa
