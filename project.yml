name: Vibe
options:
  bundleIdPrefix: com.yourname
targets:
  Vibe:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: 
      - path: Vibe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.vibe
        ENABLE_PREVIEWS: YES
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: iPhone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  VibeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [VibeTests]
    dependencies:
      - target: Vibe

  VibeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [VibeUITests]
    dependencies:
      - target: Vibe
